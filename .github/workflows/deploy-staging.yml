name: CI/CD Staging

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres real — agregado 2026-08-25 para global-config.service.test.js
    # (Configuraciones Globales): ese test es el PRIMERO del repo que necesita
    # Postgres de verdad, a propósito (verifica cifrado/descifrado pgcrypto real,
    # no tiene sentido mockearlo). El resto de la suite sigue sin tocar Mongo/
    # Postgres real, así que ningún otro test depende de este servicio.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Valores dummy — el CI no habla con Mongo/ERP real, solo necesita pasar
      # la validación de config/env.js para poder importar los módulos que la
      # requieren transitivamente. POSTGRES_URI SÍ es real acá (apunta al
      # servicio de arriba) — es el único de los tres (Mongo/Postgres/ERP) que
      # un test real necesita hoy.
      JWT_SECRET: ci-dummy-jwt-secret
      CREDS_MASTER_KEY: 9bcba551ac024af1a48af5c40d232a3c61aca49337f47c9403dc3f4cbd151374
      ERP_CAJA_BASE_URL: https://ci-dummy.local
      ERP_TOKEN: ci-dummy-token
      AUTH0_DOMAIN: ci-dummy.auth0.com
      AUTH0_AUDIENCE: https://ci-dummy-audience
      POSTGRES_URI: postgres://postgres:postgres@localhost:5432/numo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # El servidor fuerza el comando vía authorized_keys (forced command) —
      # cualquier "script" que se mande acá es ignorado, la conexión SSH sola
      # ya dispara /var/www/numo/auto-update.sh.
      - name: Trigger deploy en testnumo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          # Default de la action es 10m — el build de Docker en el servidor
          # (deps del sistema + npm install + export de la imagen) puede
          # tardar más que eso con caché frío y la action mata la conexión
          # SSH a medias, dejando el deploy incompleto (confirmado 2026-09-01).
          command_timeout: 30m
          script: echo "deploy trigger"
